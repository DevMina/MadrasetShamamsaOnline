<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مكتبة الألحان - مدرسة شمامسة أونلاين</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/site.css" />
  <meta name="description" content="تحتوي مكتبة الألحان على تقسيمات شاملة لكل المناسبات الكنسية مرفقة بالشرح والتسجيلات"/>
  <meta property="og:title" content="مكتبة الألحان القبطية"/>
  <meta property="og:description" content="تحتوي مكتبة الألحان على تقسيمات شاملة لكل المناسبات الكنسية مرفقة بالشرح والتسجيلات"/>
  <meta property="og:type" content="website"/>
  <meta name="theme-color" content="#0d6efd"/>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
</head>
<body dir="rtl">
<nav aria-label="breadcrumb" class="bg-white border-bottom px-3 py-2">
  <div class="container">
    <ol class="breadcrumb mb-0 small">
      <li class="breadcrumb-item"><a href="../index.html" class="text-decoration-none">الرئيسية</a></li><li class="breadcrumb-item active" aria-current="page">مكتبة الألحان</li>
    </ol>
  </div>
</nav>

<!-- HERO -->
<section class="text-center py-5 bg-white">
  <div class="container">
    <h1 class="display-4 mb-3">
      <i class="fa-solid fa-music mx-2 text-primary"></i>مكتبة الألحان
    </h1>
    <p class="mx-auto">
      هنا يمكنك الوصول إلى جميع الألحان حسب المناسبات والقداسات، لتعلم التسابيح والمردات الخاصة بالشمامسة
    </p>
  </div>
</section>

<!-- CARDS -->
<section class="container py-5">
  <div class="row g-4" id="alhan-grid"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/layout.js"></script>
<script>
  initLayout('الألحان');

  const alhanList = [
    { text: 'الألحان السنوية',                       href: 'Sanawy/Sanawy.html' },
    { text: 'ألحان الأعياد السيدية الصغرى 1',        href: null },
    { text: 'ألحان الأعياد السيدية الصغرى 2',        href: null },
    { text: 'ألحان النيروز والصليب',                  href: null },
    { text: 'ألحان كيهك والميلاد',                     href: null },
    { text: 'ألحان الغطاس',                           href: null },
    { text: 'ألحان صوم نينوى والصوم الكبير',          href: null },
    { text: 'ألحان سبت لعازر وأحد الشعانين',          href: null },
    { text: 'ألحان البصخة',                           href: null },
    { text: 'ألحان سبت الفرح',                        href: null },
    { text: 'ألحان الخمسين المقدسة',                  href: null },
    { text: 'ألحان صوم الرسل',                        href: null },
    { text: 'ألحان صوم السيدة العذراء',               href: null },
    { text: 'ألحان التسبحة',                          href: null },
  ];

  const grid = document.getElementById('alhan-grid');
    alhanList.forEach(item => {
    const col = document.createElement('div');
    col.className = 'col-md-4 mb-2';
    if (item.href) {
      col.innerHTML = `
        <a href="${item.href}" class="text-decoration-none">
          <div class="card text-center h-100 shadow-sm card-hover">
            <div class="card-body d-flex flex-column align-items-center justify-content-center gap-1">
              <i class="fa-solid fa-cross text-primary mb-1"></i>
              <h5 class="mb-0 text-dark">${item.text}</h5>
              
            </div>
          </div>
        </a>`;
    } else {
      col.innerHTML = `
        <div style="cursor:default">
          <div class="card text-center h-100 shadow-sm" style="opacity:0.55;border:1px solid #dee2e6">
            <div class="card-body d-flex flex-column align-items-center justify-content-center gap-1">
              <i class="fa-solid fa-cross text-muted mb-1"></i>
              <h5 class="mb-0 text-muted">${item.text}</h5>
              <span class="badge bg-secondary mt-1">قريباً</span>
            </div>
          </div>
        </div>`;
    }
    grid.appendChild(col);
  });
</script>
</body>
</html>
