<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ألحان صوم نينوى والصوم الكبير - مدرسة شمامسة أونلاين</title>
  <meta name="description" content="ألحان خاصة بفترة صوم نينوى والصوم الكبير المقدس"/>
  <meta property="og:title" content="ألحان صوم نينوى والصوم الكبير"/>
  <meta name="theme-color" content="#0d6efd"/>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/site.css" />
</head>
<body dir="rtl">
<nav aria-label="breadcrumb" class="bg-white border-bottom px-3 py-2">
  <div class="container">
    <ol class="breadcrumb mb-0 small">
      <li class="breadcrumb-item"><a href="../../index.html" class="text-decoration-none">الرئيسية</a></li>
      <li class="breadcrumb-item"><a href="../AlhanList.html" class="text-decoration-none">الألحان</a></li>
      <li class="breadcrumb-item active">ألحان صوم نينوى والصوم الكبير</li>
    </ol>
  </div>
</nav>
<section class="py-3 text-center bg-light">
  <div class="container">
    <h1 class="mb-3">ألحان صوم نينوى والصوم الكبير</h1>
    <p class="lead text-muted">ألحان خاصة بفترة صوم نينوى والصوم الكبير المقدس.</p>
  </div>
</section>
<section class="py-3">
  <div class="container">
    <div class="accordion" id="sectionsAccordion"></div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/layout.js"></script>
<script>
initLayout('ألحان صوم نينوى والصوم الكبير');
const sections = [
  {id:'1', name:'رفع بخور عشية وباكر'},
  {id:'2', name:'ألحان قداس الموعوظين'},
  {id:'3', name:'ألحان ومردات القداس الباسيلي'},
  {id:'4', name:'ألحان ومدائح التوزيع السنوي'},
];
const items = [
  {s:'1', name:'الذكصولوجيات',  href:'RafaeBokhor/ZoksologiatElSoomElKber.html'},
  {s:'1', name:'مردات الإنجيل', href:'RafaeBokhor/MaradElEngelElSoomElKber.html'},
  {s:'1', name:'الختام',        href:'RafaeBokhor/ElkhetamElSoomElKber.html'},
];
const acc = document.getElementById('sectionsAccordion');
sections.forEach((sec, i) => {
  const secItems = items.filter(x => x.s === sec.id);
  const isFirst = i === 0;
  const cardsHtml = secItems.map(item =>
    item.href
      ? `<div class="col-md-4"><a href="${item.href}" class="text-decoration-none"><div class="card text-center h-100 shadow-sm card-hover" style="border:2px solid #0d6efd"><div class="card-body"><h5 class="mb-0 text-primary">${item.name}</h5></div></div></a></div>`
      : `<div class="col-md-4"><div class="card text-center h-100 shadow-sm" style="opacity:.55"><div class="card-body"><h5 class="mb-0 text-muted">${item.name}</h5><span class="badge bg-secondary mt-1">قريباً</span></div></div></div>`
  ).join('');
  acc.innerHTML += `
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button ${!isFirst?'collapsed':''}" type="button"
                data-bs-toggle="collapse" data-bs-target="#sec${sec.id}" aria-expanded="${isFirst}">
          <i class="fa-solid fa-cross mx-2"></i>${sec.name}
        </button>
      </h2>
      <div id="sec${sec.id}" class="accordion-collapse collapse ${isFirst?'show':''}" data-bs-parent="#sectionsAccordion" data-bs-parent="#sectionsAccordion">
        <div class="accordion-body"><div class="row g-4">${cardsHtml}</div></div>
      </div>
    </div>`;
});
</script>
</body>
</html>
